name: Fleet Protocol & Stdio Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  protocol-gate:
    name: MCP Protocol Gate (2025-11-25)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate Client Configurations
        run: |
          python scripts/configure_clients.py

      - name: Run MCP 8/8 Protocol Gate Probe
        run: |
          python tests/probe_v2.py
